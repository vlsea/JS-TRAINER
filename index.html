<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Todo List</h1>
            <p id="taskCounter">Задач: 0</p>
        </header>

        <form id="todoForm">
            <input 
                type="text" 
                id="newTask" 
                placeholder="Введите новую задачу или нажмите Enter для редактирования..."
                maxlength="100"
            >
            <button type="submit">➕ Добавить/Сохранить</button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Выполненные</button>
        </div>

        <ul id="todoList"></ul>

        <div class="actions">
            <button id="clearCompleted" disabled>🗑️ Удалить выполненные</button>
            <button id="clearAll" disabled>❌ Удалить все</button>
        </div>

        <div class="info">
            <button id="exportBtn">📥 Экспорт JSON</button>
            <button id="importBtn">📤 Импорт JSON</button>
            <input type="file" id="importFile" accept=".json" style="display: none;">
        </div>
    </div>

    <script src="index.js" type="module"></script>
</body>
</html>
