<!DOCTYPE html>
<html lang="ru">
<head>
  <link rel="stylesheet" href="/styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
    <h1>События DOM</h1>

    <section>
        <h2>Див клик (+15px)</h2>
        <div class="grow-div" onclick="growDiv(this)">Кликни меня</div>
    </section>

    <section>
        <h2>Див двойной клик</h2>
        <div class="dblclick-div" ondblclick="dblClickDiv(this)">
            <strong>Иван Иванов</strong><br>
            Возраст: 28 лет<br>
            Профессия: Разработчик<br>
            Город: Санкт-Петербург
        </div>
    </section>

    <section>
        <h2>Переключение картинок</h2>
        <img class="image-toggle" 
             src="https://via.placeholder.com/250x180/ff6b6b/ffffff?text=Картинка+1" 
             onclick="toggleImage(this)" 
             alt="Картинка 1">
    </section>

    <section>
        <h2>Код символа</h2>
        <input type="text" id="char-input" placeholder="Один символ" maxlength="1">
        <button onclick="getCharCode()">Получить код</button>
        <div id="char-code-result"></div>
    </section>

    <section>
        <h2>Проверка цифры</h2>
        <input type="text" id="digit-input" placeholder="Один символ">
        <button onclick="checkDigit()">Проверить</button>
        <div id="digit-result"></div>
    </section>


  <script src="index.js"></script>
</body>
</html>
