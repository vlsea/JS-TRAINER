<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Формы GET и POST</title>
  </head>
  <body>
    <h2>GET-запрос (параметры в URL)</h2>
    <form action="https://httpbin.org/get" method="get" target="_blank">
      <input
        type="text"
        name="name"
        value="Erik"
        placeholder="Имя"
      /><br /><br />
      <input
        type="text"
        name="surname"
        value="Dark"
        placeholder="Фамилия"
      /><br /><br />
      <input type="submit" value="Отправить GET" />
    </form>

    <h2>POST-запрос (параметры в body, в адресной строке ничего нет)</h2>
    <form action="https://httpbin.org/post" method="post" target="_blank">
      <input
        type="text"
        name="name"
        value="Erik"
        placeholder="Имя"
      /><br /><br />
      <input
        type="text"
        name="surname"
        value="Dark"
        placeholder="Фамилия"
      /><br /><br />
      <input type="submit" value="Отправить POST" />
    </form>
  </body>
</html>
